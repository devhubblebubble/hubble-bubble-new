# One-off helper, not part of the site. Swaps the old contact email for the new
# one in every Sanity document (see studio/scripts/replace-email.mjs). It starts
# by itself only when this file or that script changes. Delete both once it has
# run.
# Needs the repository secret SANITY_WRITE_TOKEN (a Sanity API token with Editor permission).

name: Replace contact email in Sanity

on:
  push:
    branches: [sanity-cms]
    paths:
      - ".github/workflows/replace-email.yml"
      - "studio/scripts/replace-email.mjs"

jobs:
  replace:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Swap the email
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
        run: |
          set -o pipefail
          node scripts/replace-email.mjs 2>&1 | tee replace-output.txt

      - name: Report result
        if: always()
        run: |
          tail -c 2500 replace-output.txt | tr '\r\n' '  ' > tail.txt || true
          echo "::notice title=Email swap::$(cat tail.txt)"
