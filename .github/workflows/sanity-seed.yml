# Imports the starting content into Sanity.
# A push imports only the blog (content/seed/blog-topics.json and content/blog/*.md):
# new topics and posts are created, existing ones are never touched.
# The pages, settings and other collections were imported long ago and are edited
# in the Studio now. Importing them again would bring back any placeholder document
# deleted in the Studio and refill any field emptied on purpose, so that only
# happens when someone runs this workflow by hand and chooses "all".
# Needs the repository secret SANITY_WRITE_TOKEN (a Sanity API token with Editor permission).

name: Import starting content into Sanity

on:
  push:
    branches: [sanity-cms]
    paths:
      - "content/seed/**"
      - "content/blog/**"
      - "studio/scripts/seed.mjs"
      - ".github/workflows/sanity-seed.yml"
  workflow_dispatch:
    inputs:
      only:
        description: "What to import: blog (topics and posts only) or all (also pages, settings, roles, stories, team, universities)"
        required: true
        default: "blog"
        type: choice
        options: [blog, all]

jobs:
  seed:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: studio
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: studio/package-lock.json

      - name: Install
        run: npm ci

      - name: Import content
        env:
          SANITY_WRITE_TOKEN: ${{ secrets.SANITY_WRITE_TOKEN }}
          SEED_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.only || 'blog' }}
        run: |
          set -o pipefail
          npm run seed 2>&1 | tee seed-output.txt

      - name: Report result
        if: always()
        run: |
          tail -c 1500 seed-output.txt | tr '\r\n' '  ' > tail.txt || true
          echo "::notice title=Import output::$(cat tail.txt)"
