# One-off helper, not part of the site. Sends ONE clearly labelled test message
# through the test site's contact form and reports what came back, so a failed
# send can be worked out without opening Cloudflare. Each run sends one real
# email to the team inbox. It starts by itself only when this file changes, or
# when someone re-runs it from the Actions tab. Delete this file once the forms
# are confirmed working.

name: Probe contact form

on:
  push:
    branches: [sanity-cms]
    paths:
      - ".github/workflows/probe-form.yml"

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Send one test message
        env:
          SITE: https://hubble-bubble-new.jevinzac.workers.dev
        run: |
          code=$(curl -sS -m 30 -o body.txt -w '%{http_code}' -X POST "$SITE/api/contact" \
            -H 'Content-Type: application/json' \
            -H "Origin: $SITE" \
            --data '{"type":"general","name":"Setup test (ignore)","email":"setup-test@example.com","message":"Automated test from the website setup. You can ignore this email.","elapsedMs":5000,"_gotcha":""}') || code="curl-failed"
          body=$(head -c 400 body.txt 2>/dev/null | tr '\n' ' ')
          echo "HTTP $code $body"
          echo "::notice title=Contact form probe::HTTP $code $body"
